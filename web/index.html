  <script>
    // Capture l'invite d'installation PWA pour pouvoir la déclencher depuis l'app Flutter
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPWAInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-install-ready'));
    });
    window.addEventListener('appinstalled', () => {
      window.deferredPWAInstallPrompt = null;
      console.log('PWA Miva Fid installée avec succès !');
    });

    window.promptPWAInstall = async function() {
      if (window.deferredPWAInstallPrompt) {
        window.deferredPWAInstallPrompt.prompt();
        const { outcome } = await window.deferredPWAInstallPrompt.userChoice;
        window.deferredPWAInstallPrompt = null;
        return outcome === 'accepted';
      }
      return false;
    };

    window.isPWAInstalled = function() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };
  </script>

  <style id="splash-screen-style">
    :root {
      --bg: #0F0E1A;
      --card: #19172B;
      --sk: #25223D;
      --sk-hi: #343055;
    }
    @media (prefers-color-scheme: light) {

        --bg: #F8FAFC;
        --card: #FFFFFF;
        --sk: #E2E8F0;
        --sk-hi: #F1F5F9;
      }

    html, body {
      height: 100%;
      margin: 0;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: var(--bg);
      padding: 20px 16px;
      box-sizing: border-box;
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }
    .sk {
      background: linear-gradient(90deg, var(--sk) 25%, var(--sk-hi) 50%, var(--sk) 75%);
      background-size: 200% 100%;
      animation: sk-shimmer 1.25s infinite linear;
      border-radius: 12px;
    }
    .sk-row { display: flex; align-items: center; gap: 12px; }
    .sk-circle { width: 42px; height: 42px; border-radius: 999px; flex-shrink: 0; }
    .sk-hero { height: 156px; border-radius: 18px; }
    .sk-card {
      background: var(--card);

      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sk-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @keyframes sk-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
    window.addEventListener("flutter-first-frame", removeSplashFromWeb, { once: true });
  </script>

    (function () {
      var FCM_SCOPE = '/firebase-cloud-messaging-push-scope';
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: FCM_SCOPE }).catch(function () {});
      }
      window.__mivaWebPush = {
        isIosNonPwa: function () {
          var ua = navigator.userAgent || '';
          var isIos = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
          return isIos && !isStandalone;
        },
        getState: function () {
          if (this.isIosNonPwa() && !('Notification' in window)) return 'ios_install_required';
          if (!('Notification' in window) || !('serviceWorker' in navigator)) return 'unsupported';
          return Notification.permission || 'default';
        },
        ensureServiceWorker: function () {
          if (!('serviceWorker' in navigator)) return Promise.resolve(false);
          return navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: FCM_SCOPE })
            .then(function (reg) { return Boolean(reg); })
            .catch(function () { return false; });
        },
        requestPermission: function () {
          if (!('Notification' in window)) return Promise.resolve('unsupported');
          try {
            var res = Notification.requestPermission();
            if (res && typeof res.then === 'function') {
              return res.then(function (p) { return p || 'default'; }).catch(function () { return Notification.permission || 'denied'; });
            }
            return Promise.resolve(Notification.permission || 'default');
          } catch (e) {
            return Promise.resolve('denied');
          }
        }
      };
