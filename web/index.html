  <script>
    // Capture l'invite d'installation PWA pour pouvoir la déclencher depuis l'app Flutter
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPWAInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-install-ready'));
    });
    window.addEventListener('appinstalled', () => {
      window.deferredPWAInstallPrompt = null;
      console.log('PWA Miva Fid installée avec succès !');
    });

    window.promptPWAInstall = async function() {
      if (window.deferredPWAInstallPrompt) {
        window.deferredPWAInstallPrompt.prompt();
        const { outcome } = await window.deferredPWAInstallPrompt.userChoice;
        window.deferredPWAInstallPrompt = null;
        return outcome === 'accepted';
      }
      return false;
    };

    window.isPWAInstalled = function() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };

    // Enregistrement explicite du Service Worker PWA (FCM Push + Cache Offline complet)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' })
          .then(function(reg) {
            console.log('[PWA] Service worker enregistré avec succès:', reg.scope);
          })
          .catch(function(err) {
            console.warn('[PWA] Erreur enregistrement service worker:', err);
          });
      });
    }

    // Réalignement PWA : vérifie si une nouvelle version applicative est disponible
    (function realignPwaAssets() {
      var RELOAD_GUARD_KEY = 'mivafid_pwa_realigned';
      var VERSION_KEY = 'mivafid_build_sig';

      async function run() {
        // En mode hors-ligne, ne pas tenter de rechargement ou de purge
        if (!navigator.onLine) return;

        var needsReload = false;

        // Désactive l'ancien service worker par défaut de Flutter s'il traîne encore
        if ('serviceWorker' in navigator) {
          try {
            var regs = await navigator.serviceWorker.getRegistrations();
            for (var i = 0; i < regs.length; i++) {
              var reg = regs[i];
              var urls = [
                reg.active && reg.active.scriptURL,
                reg.waiting && reg.waiting.scriptURL,
                reg.installing && reg.installing.scriptURL
              ].filter(Boolean);
              var isLegacyFlutterSw = urls.some(function(u) {
                return u.indexOf('flutter_service_worker.js') !== -1;
              });
              if (isLegacyFlutterSw) {
                var unregistered = await reg.unregister();
                if (unregistered) needsReload = true;
              }
            }
          } catch (_) {}
        }

        try {
          var res = await fetch('flutter_bootstrap.js?t=' + Date.now(), { cache: 'no-store' });
          if (res.ok) {
            var text = await res.text();
            var match = text.match(/serviceWorkerVersion:\s*"([^"]+)"/);
            var sig = match ? match[1] : String(text.length);
            var prev = localStorage.getItem(VERSION_KEY);
            if (prev && prev !== sig) {
              needsReload = true;
            }
            localStorage.setItem(VERSION_KEY, sig);
          }
        } catch (_) {}

        if (needsReload && !sessionStorage.getItem(RELOAD_GUARD_KEY)) {
          sessionStorage.setItem(RELOAD_GUARD_KEY, '1');
          window.location.reload();
        } else {
          sessionStorage.removeItem(RELOAD_GUARD_KEY);
        }
      }

      // Exécuter la vérification de mise à jour après le premier rendu pour ne jamais
      // concurrencer le chargement initial de Flutter et du flux Google OAuth.
      function scheduleRun() {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(function() { run(); }, { timeout: 3000 });
        } else {
          setTimeout(run, 1200);
        }
      }
      window.addEventListener('flutter-first-frame', scheduleRun, { once: true });
      window.addEventListener('load', function() {
        setTimeout(run, 2500);
      }, { once: true });
    })();

    // ─── Protection écran noir PWA / Web : veille prolongée & perte WebGL ─────────
    (function setupPwaResumeRecovery() {
      var _hiddenTimestamp = 0;
      var _webglLost = false;

      // Détecter la révocation du contexte WebGL par l'OS mobile (iOS/Android)
      window.addEventListener('webglcontextlost', function(e) {
        console.warn('[PWA] Contexte WebGL perdu en arrière-plan.');
        _webglLost = true;
        if (e && e.preventDefault) {
          e.preventDefault();
        }
      }, true);

      window.addEventListener('webglcontextrestored', function() {
        console.log('[PWA] Contexte WebGL restauré avec succès.');
        _webglLost = false;
        window.dispatchEvent(new Event('resize'));
      }, true);

      function hasDeadCanvas() {
        if (_webglLost) return true;
        try {
          var canvases = document.querySelectorAll('canvas');
          for (var i = 0; i < canvases.length; i++) {
            var c = canvases[i];
            var gl = c.getContext('webgl2') || c.getContext('webgl');
            if (gl && gl.isContextLost && gl.isContextLost()) {
              return true;
            }
          }
        } catch (_) {}
        return false;
      }

      function onAppResume() {
        var now = Date.now();
        var elapsed = _hiddenTimestamp > 0 ? (now - _hiddenTimestamp) : 0;
        _hiddenTimestamp = 0;

        // Si le contexte WebGL a été détruit par l'OS ou si l'app est restée en arrière-plan
        // plus de 20 minutes (seuil où WebKit / Safari suspend définitivement l'état GPU) :
        var isDead = hasDeadCanvas();
        var isLongIdle = elapsed > (20 * 60 * 1000);

        if (isDead || isLongIdle) {
          console.warn('[PWA] Reprise après veille prolongée (' + Math.round(elapsed / 1000) + 's) - Rechargement automatique préventif.');
          var GUARD_KEY = 'miva_resume_reload_guard';
          var lastReload = parseInt(sessionStorage.getItem(GUARD_KEY) || '0', 10);
          if (now - lastReload > 8000) {
            sessionStorage.setItem(GUARD_KEY, String(now));
            window.location.reload();
            return;
          }
        }

        // Réveil forcé de la boucle de rendu Flutter CanvasKit
        window.dispatchEvent(new Event('resize'));
        if (window.requestAnimationFrame) {
          requestAnimationFrame(function() {
            window.dispatchEvent(new Event('resize'));
          });
        }
      }

      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'hidden') {
          _hiddenTimestamp = Date.now();
        } else if (document.visibilityState === 'visible') {
          onAppResume();
        }
      });

      window.addEventListener('pageshow', function(e) {
        if (e && e.persisted) {
          onAppResume();
        }
      });
    })();
  </script>

  <style id="splash-screen-style">
    :root {
      --bg: #0F0E1A;
      --accent: #6366F1;
      --ring: rgba(99, 102, 241, 0.2);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F8FAFC;
        --accent: #4F46E5;
        --ring: rgba(79, 70, 229, 0.16);
      }
    }
    html, body {
      height: 100%;
      margin: 0;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 120ms ease-out;
    }
    #splash.splash-out {
      opacity: 0;
    }
    .splash-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: splash-appear 160ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .splash-spinner {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 2.5px solid var(--ring);
      border-top-color: var(--accent);
      animation: splash-spin 650ms linear infinite;
    }
    @keyframes splash-appear {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      var el = document.getElementById("splash");
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
      if (!el) return;
      el.classList.add("splash-out");
      setTimeout(function() { el.remove(); }, 130);
    }
    window.addEventListener("flutter-first-frame", removeSplashFromWeb, { once: true });
  </script>
