org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Works around "Could not close incremental caches" failures from the Kotlin
# Build Tools API on Windows (file-lock race during parallel compilation).
kotlin.incremental=false
org.gradle.parallel=false
# Daemon off: a lingering daemon killed mid-write when Windows shuts down
# corrupts the Gradle cache (journal-1/file-access.bin), breaking every
# subsequent build until the cache is wiped. A fresh JVM per build closes
# cleanly and never leaves the cache in a half-written state.
org.gradle.daemon=false
