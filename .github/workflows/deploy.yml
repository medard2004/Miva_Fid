name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Récupération des dépendances
        run: flutter pub get

      - name: Compilation Flutter Web
        run: flutter build web --release --no-tree-shake-icons --dart-define=API_BASE_URL="${{ secrets.API_BASE_URL || 'https://distract-buffalo-mockup.ngrok-free.dev/api' }}"

      - name: Préparer vercel.json pour le déploiement
        run: |
          cat > build/web/vercel.json << 'EOF'
          {
            "rewrites": [
              { "source": "/(.*)", "destination": "/index.html" }
            ],
            "headers": [
              {
                "source": "/flutter_service_worker.js",
                "headers": [
                  { "key": "Cache-Control", "value": "no-cache" }
                ]
              }
            ]
          }
          EOF

      - name: Déploiement sur Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          cd build/web
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
